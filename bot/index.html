<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bot Free Fire Sofai 4H</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg, #4b0082, #7b2cbf);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      color:white;
      text-align:center;
    }

    .container{
      background: rgba(255,255,255,0.08);
      padding:40px 25px;
      border-radius:20px;
      max-width:500px;
      width:100%;
      backdrop-filter: blur(8px);
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    h1{
      font-size:2.2rem;
      margin-bottom:20px;
      color:#ffffff;
    }

    p{
      font-size:1.1rem;
      line-height:1.7;
      color:#f3e8ff;
    }

    .emoji{
      font-size:2rem;
      margin-top:20px;
    }

    @media (max-width:600px){
      h1{
        font-size:1.8rem;
      }

      p{
        font-size:1rem;
      }

      .container{
        padding:30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔥 Bot Free Fire Sofai 4H 🔥</h1>

    <p>
      We are working very hard on this project 💜✨<br><br>
      The bot will be available soon 🚀🎮<br>
      Stay tuned for something amazing 😎🔥
    </p>

    <div class="emoji">
      💜 🤖 🎯 🚀
    </div>
  </div>

</body>
</html>
