<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SofAI 4H</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0d0d14;
    color:white;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
}

/* NAVBAR */

nav{
    width:100%;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(20,20,35,.95);
    border-bottom:1px solid #8a2be2;
    box-shadow:0 0 20px #8a2be280;
}

nav h1{
    color:#b56cff;
    font-size:1.5rem;
    text-shadow:0 0 10px #b56cff;
}

.nav-links{
    display:flex;
    gap:15px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    transition:.3s;
    font-size:.9rem;
}

.nav-links a:hover{
    color:#b56cff;
    text-shadow:0 0 10px #b56cff;
}

/* MAIN */

.container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

.title{
    font-size:2rem;
    color:#d7b3ff;
    text-shadow:0 0 20px #8a2be2;
    margin-bottom:20px;
}

.countdown{
    font-size:5rem;
    font-weight:bold;
    color:#b56cff;
    text-shadow:
        0 0 10px #b56cff,
        0 0 30px #8a2be2,
        0 0 60px #8a2be2;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
    }
}

button{
    margin-top:30px;
    padding:14px 35px;
    border:none;
    border-radius:30px;
    background:#8a2be2;
    color:white;
    font-size:1rem;
    cursor:pointer;
    display:none;
    transition:.3s;
    box-shadow:0 0 20px #8a2be2;
}

button:hover{
    background:#a855ff;
    transform:translateY(-3px);
}

.language-box{
    position:fixed;
    inset:0;
    background:#000000ee;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.language-card{
    background:#161625;
    padding:30px;
    border-radius:20px;
    text-align:center;
    border:1px solid #8a2be2;
    box-shadow:0 0 30px #8a2be2;
}

.language-card h2{
    margin-bottom:20px;
}

.lang-btns{
    display:flex;
    gap:10px;
    justify-content:center;
}

.lang-btns button{
    display:block;
    margin:0;
}

/* MOBILE */

@media(max-width:768px){

    nav{
        flex-direction:column;
        gap:10px;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
    }

    .title{
        font-size:1.5rem;
    }

    .countdown{
        font-size:4rem;
    }
}
</style>
</head>
<body>

<nav>
    <h1>SofAI 4H</h1>

    <div class="nav-links">
        <a href="https://youtube.com/@sofai4h" target="_blank">
            SofAI 4H
        </a>

        <a href="https://youtube.com/@morgan4h" target="_blank">
            Morgan 4H
        </a>

        <a href="https://youtube.com/@tmk4h" target="_blank">
            TMK 4H
        </a>
    </div>
</nav>

<div id="languageBox" class="language-box">
    <div class="language-card">
        <h2>Choose Language</h2>

        <div class="lang-btns">
            <button onclick="setLanguage('en')">
                English
            </button>

            <button onclick="setLanguage('ar')">
                العربية
            </button>
        </div>
    </div>
</div>

<div class="container">
    <h2 class="title" id="title">
        Bot SofAI 4H is Ready
    </h2>

    <div class="countdown" id="countdown">
        5
    </div>

    <button id="startBtn">
        Start
    </button>
</div>

<script>
const title = document.getElementById("title");
const countdown = document.getElementById("countdown");
const startBtn = document.getElementById("startBtn");
const languageBox = document.getElementById("languageBox");

function applyLanguage(lang){

    if(lang === "ar"){
        document.documentElement.lang = "ar";
        document.body.dir = "rtl";

        title.textContent = "بوت سوفاي 4H جاهز";
        startBtn.textContent = "ابدأ";
    }else{
        document.documentElement.lang = "en";
        document.body.dir = "ltr";

        title.textContent = "Bot SofAI 4H is Ready";
        startBtn.textContent = "Start";
    }
}

function setLanguage(lang){
    localStorage.setItem("sofai_lang", lang);
    localStorage.setItem("sofai_first_visit", "done");

    applyLanguage(lang);

    languageBox.style.display = "none";

    startCountdown();
}

function startCountdown(){

    let count = 5;

    countdown.textContent = count;

    const timer = setInterval(() => {

        count--;

        countdown.textContent = count;

        if(count <= 0){
            clearInterval(timer);

            countdown.innerHTML = "🚀";

            startBtn.style.display = "inline-block";
        }

    },1000);
}

const savedLang = localStorage.getItem("sofai_lang");
const firstVisit = localStorage.getItem("sofai_first_visit");

if(savedLang){
    applyLanguage(savedLang);
}

if(firstVisit){
    languageBox.style.display = "none";

    countdown.style.display = "none";

    startBtn.style.display = "inline-block";
}else{
    languageBox.style.display = "flex";
}

startBtn.addEventListener("click", () => {
   location.href = 'https://botsofai4h.bonto.run/'
});
</script>

</body>
</html>
