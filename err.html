<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Error - Page Not Found</title>
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <style>
    :root {
      --bg-color: #f4f4f9;
      --text-color: #333;
      --card-bg: #ffffffcc;
      --nav-bg: #1f1f1f;
      --gradient: linear-gradient(135deg, #6e8efb, #a777e3);
    }
    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --text-color: #f1f1f1;
      --card-bg: #2a2a2acc;
      --nav-bg: #000;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.4s, color 0.4s;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    /* Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 0 0 20px 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .nav-logo {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-color);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .nav-links a,
    .nav-links button {
      padding: 0.5rem 1rem;
      border-radius: 12px;
      font-weight: 500;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-color);
      transition: all 0.3s ease;
    }
    .nav-links a:hover,
    .nav-links button:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    /* Header Section */
    .header {
      padding: 3rem 1rem;
      text-align: center;
      background: var(--gradient);
      color: #fff;
    }
    .header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }
    /* Main Error Section */
    .error-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
      text-align: center;
    }
    .error-container h2 {
      font-size: 4rem;
      margin-bottom: 1rem;
      color: #6c63ff;
    }
    .error-container p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }
    .error-container button {
      padding: 0.8rem 1.5rem;
      border: none;
      background: var(--gradient);
      color: #fff;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .error-container button:hover {
      background: #6c63ff;
    }
    /* Footer */
    .footer {
      background: var(--nav-bg);
      color: #ccc;
      padding: 1rem;
      text-align: center;
    }
    .footer a {
      color: #fff;
      margin: 0 0.5rem;
    }
    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8rem;
      }
      .error-container h2 {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-logo">MyLogo</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <button class="theme-toggle" onclick="toggleTheme()">🌙/☀️</button>
    </div>
  </nav>
  
  <!-- Header Section -->
  <header class="header">
    <h1>404 - Page Not Found</h1>
    <p>Sorry, we couldn't find the page you're looking for.</p>
  </header>
  
  <!-- Main Error Content -->
  <div class="error-container">
    <h2>404</h2>
    <p>The page you are trying to access does not exist. Please check the URL or return to the homepage.</p>
    <button onclick="window.location.href='index.html?t=sofai4h'">SOFAI 4H</button>
    <br>
    <button onclick="window.location.href='index.html?t=morgan4h'">MORGAN 4H</button>
    <br>
    <button onclick="window.location.href='index.html?t=tmk4h'">TMK 4H</button>
  </div>
  
  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Modern Social Cards. All rights reserved.</p>
  </footer>
  
  <!-- JavaScript for Theme Toggle -->
  <script>
    function toggleTheme() {
      const theme = document.documentElement.getAttribute("data-theme");
      document.documentElement.setAttribute("data-theme", theme === "dark" ? "light" : "dark");
    }
  </script>
</body>
</html>
