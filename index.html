<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connect With Me</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* RESET */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #0f172a, #020617);
            font-family: "Segoe UI", system-ui, sans-serif;
            padding: 20px;
        }

        /* CARD */
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            width: 100%;
            max-width: 420px;   /* phone default */
            padding: 28px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.5);
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #fff;
            margin-bottom: 22px;
            font-size: 22px;
        }

        /* BUTTONS */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease,
                        background 0.3s ease;
        }

        .btn i {
            font-size: 18px;
        }

        .btn-x {
            background: linear-gradient(135deg, #1da1f2, #0c4a6e);
        }

        .btn-yt {
            background: linear-gradient(135deg, #ff0000, #b91c1c);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(0,0,0,0.45);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .hint {
            margin-top: 12px;
            color: #94a3b8;
            font-size: 13px;
        }

        /* ==========================
           DESKTOP ENHANCEMENTS
           ========================== */
        @media (min-width: 768px) {
            .card {
                max-width: 520px;
                padding: 40px;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 30px;
            }

            .btn {
                font-size: 17px;
                padding: 18px;
            }

            .btn i {
                font-size: 22px;
            }

            .hint {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Let’s Connect</h1>

        <a href="https://x.com/nothing0qw"
           target="_blank"
           class="btn btn-x">
            <i class="fa-brands fa-x-twitter"></i>
            Follow on X
        </a>

        <a href="https://www.youtube.com/@SOFAI4H"
           target="_blank"
           class="btn btn-yt">
            <i class="fa-brands fa-youtube"></i>
            Subscribe on [SOFAI]
        </a>

            <a href="https://www.youtube.com/@morgan4h"
           target="_blank"
           class="btn btn-yt">
            <i class="fa-brands fa-youtube"></i>
            Subscribe on [MORGAN]]
        </a>

            <a href="https://www.youtube.com/@tmk4h"
           target="_blank"
           class="btn btn-yt">
            <i class="fa-brands fa-youtube"></i>
            Subscribe on [TMK]
        </a>

           <a href="mailto:4h0ads0now@gmail.com"
           target="_blank"
           class="btn btn-x">
            <i class="fa-brands fa-x-twitter"></i>
            Email Us
        </a>

        <div class="hint">
           craeted by chatGPT || edited by me (:)
        </div>
    </div>

</body>
</html>
