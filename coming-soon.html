    .feature-cards-container {

    }
    
    .form-container {

      transition: all 0.3s;

    .form-control:focus {

      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
    }
    
    .form-button {
      width: 100%;
      padding: 0.8rem;
      background: var(--btn-gradient);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .form-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }
    
    @media (max-width: 768px) {
      .coming-soon-title {

      .event-title {

        margin-bottom: 1rem;

        padding: 0 1rem;

      .countdown-container {
        gap: 1rem;
      }
      
      .countdown-item {
        min-width: 65px;
      }
      
      .countdown-value {

      }
      
      .countdown-label {

    }

  <script>
    // Theme toggling functionality
    function toggleTheme() {
      const theme = document.documentElement.getAttribute("data-theme");
      document.documentElement.setAttribute("data-theme", theme === "dark" ? "light" : "dark");
    }
    
    // Mobile menu toggle
    document.addEventListener('DOMContentLoaded', function() {
      const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
      const navLinks = document.getElementById('nav-links');
      
      if (mobileMenuToggle) {
        mobileMenuToggle.addEventListener('click', function() {
          mobileMenuToggle.classList.toggle('active');
          navLinks.classList.toggle('active');
        });
      }
      
      // Reveal animations on scroll
      const reveals = document.querySelectorAll('.reveal');
      
      function checkReveal() {
        const windowHeight = window.innerHeight;
        const elementVisible = 100;
        
        reveals.forEach(reveal => {
          const elementTop = reveal.getBoundingClientRect().top;
          
          if (elementTop < windowHeight - elementVisible) {
            reveal.classList.add('active');
          }
        });
      }
      
      // Set up staggered animations
      reveals.forEach((card, index) => {
        card.style.transitionDelay = `${index * 0.1}s`;
      });
      
      // Initial check
      setTimeout(checkReveal, 100);
      
      // Add scroll event listener
      window.addEventListener('scroll', checkReveal);
      
      // Initialize countdown
      initCountdown();
    });
    
    // Countdown Timer Logic
    function initCountdown() {
      // Set the event details (title and date)
      const eventTitle = "Telegram coming";
      const eventDate = new Date();
      eventDate.setDate(eventDate.getDate() + 1); // Default: 30 days from now
      
      // You can set a specific date like this:
      // const eventDate = new Date("2025-12-31T23:59:59");
      
      // Update the event title
      document.getElementById('event-title').textContent = eventTitle;
      
      // Update the countdown every second
      updateCountdown(eventDate);
      setInterval(() => updateCountdown(eventDate), 1000);
    }
    
    function updateCountdown(eventDate) {
      const currentTime = new Date();
      const difference = eventDate - currentTime;
      
      // Calculate time components
      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);
      
      // Update the HTML
      document.getElementById('days').textContent = days.toString().padStart(2, '0');
      document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
      document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
      document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
      
      // If the countdown is over
      if (difference < 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        
        clearInterval(countdownInterval);
        document.getElementById('event-title').textContent = "The Event Has Started!";
      }
    }
    
    // Form submission
    function submitForm(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      alert(`Thank you! We'll notify ${email} when we launch.`);
      document.getElementById('notification-form').reset();
      return false;
    }
  </script>
